<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>mini-paas deployment pipeline</title>
<desc>Flowchart showing how a git push becomes a live, cleanly-routed app: push, hook checkout, docker rebuild, nginx routing, live app.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="520" fill="#ffffff"/>

<g>
<rect x="140" y="40" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Developer pushes code</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">git push to the bare repo</text>
</g>
<line x1="340" y1="96" x2="340" y2="134" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="140" y="136" width="400" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">post-receive hook fires</text>
<text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">checks out the new code</text>
</g>
<line x1="340" y1="192" x2="340" y2="230" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="140" y="232" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Docker rebuilds the app</text>
<text x="340" y="270" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">old container replaced with new</text>
</g>
<line x1="340" y1="288" x2="340" y2="326" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="140" y="328" width="400" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Nginx routes the request</text>
<text x="340" y="366" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">maps a clean URL to the port</text>
</g>
<line x1="340" y1="384" x2="340" y2="422" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="140" y="424" width="400" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="444" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">App is live</text>
<text x="340" y="462" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#27500A">reachable at localhost/myapp</text>
</g>
</svg>
